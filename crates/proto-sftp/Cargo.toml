[package]
name = "proto-sftp"
description = "File operations over the SFTP subsystem of an SSH session, edit-and-upload copies and file comparison, ported from PlexusTerm v0.2.15 (PRD SFTP-1..SFTP-3, SEC-e)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
proto-ssh = { path = "../proto-ssh" }
# Same versions as PlexusTerm v0.2.15's Cargo.lock.
encoding_rs = "=0.8.42"
# What v0.2.15's tauri-plugin-opener used to open a file with its default or a chosen program.
open = { version = "=5.4.4", features = ["shellexecute-on-windows"] }
russh-sftp = "=3.0.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt", "fs", "io-util", "time", "sync"] }

[dev-dependencies]
proto-ssh = { path = "../proto-ssh", features = ["test-support"] }
russh = "=0.64.1"
term-engine = { path = "../term-engine" }
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "fs", "io-util", "time", "sync", "macros"] }
zeroize = "=1.9.1"

[lints]
workspace = true
