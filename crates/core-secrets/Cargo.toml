[package]
name = "core-secrets"
description = "Saved passwords and API keys in the system keyring, named as PlexusTerm v0.2.15 names them (PRD DATA-3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# In-memory and blocking stores for other crates' tests.
test-support = []

[dependencies]
keyring = "=4.2.0"
keyring-core = "=1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt", "macros"] }
core-secrets = { path = ".", features = ["test-support"] }

[lints]
workspace = true
