[package]
name = "proto-serial"
description = "Serial console sessions (USB adapters, on-board UARTs), ported from PlexusTerm v0.2.15 (PRD SER-1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
term-engine = { path = "../term-engine" }
# Same versions as PlexusTerm v0.2.15's Cargo.lock; no libudev (ports are listed from sysfs).
serialport = { version = "=4.10.1", default-features = false }
thiserror = "=2.0.21"

[dev-dependencies]
portable-pty = "=0.9.0"
tempfile = "=3.27.0"

[lints]
workspace = true
