[package]
name = "tools"
description = "Tools menu back ends ported from PlexusTerm v0.2.15 src-tauri/src/tools (PRD TOOL-1..TOOL-4): SSH key generator, port and network scanners, Wake On LAN and the remote monitor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
proto-ssh = { path = "../proto-ssh" }
# Same versions as PlexusTerm v0.2.15's Cargo.lock.
russh = "=0.64.1"
# OS random source for SSH key generation.
rand = { version = "=0.10.3", default-features = false, features = ["sys_rng"] }
zeroize = "=1.9.1"
# PuTTY .ppk v3 export (Argon2id + HMAC-SHA-256); same versions ssh-key already uses.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
hmac = "=0.13.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt", "net", "time", "sync", "macros", "process", "fs"] }

[dev-dependencies]
proto-ssh = { path = "../proto-ssh", features = ["test-support"] }
term-engine = { path = "../term-engine" }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "process", "fs"] }

[lints]
workspace = true
