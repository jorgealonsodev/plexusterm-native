[package]
name = "project-settings"
description = "A project's own settings in <project>/.plexusterm/settings.json (its tab and toolbar colours), ported from PlexusTerm v0.2.15 (PRD DATA-1b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
core-storage = { path = "../core-storage" }
# Same version as PlexusTerm v0.2.15's Cargo.lock.
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
