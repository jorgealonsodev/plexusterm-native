[package]
name = "ui-kit"
description = "PlexusTerm widgets on GPUI primitives, styled from the ui-theme tokens (PRD §8.4-8.6, D4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The same pinned Zed rev as `crates/app` (PRD §6.2, ST-13); only Apache-2.0 crates (D5).
gpui = { git = "https://github.com/zed-industries/zed", rev = "a484d108da9164cd6a705e7422a0ddd33499fb50" }
ui-theme = { path = "../ui-theme" }
unicode-segmentation = "1.13"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a484d108da9164cd6a705e7422a0ddd33499fb50", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a484d108da9164cd6a705e7422a0ddd33499fb50", features = ["x11", "wayland"] }

[lints]
workspace = true
